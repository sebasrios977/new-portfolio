      rel="stylesheet"
    />
    <script>
      // Applies a stored theme before first paint, so returning visitors never
      // flash the default first. Runs synchronously and on purpose: deferring
      // it would put the flash back.
      //
      // Only a stored choice is applied. With no choice, nothing is stamped and
      // the stylesheet's own default (light) stands — the OS preference is not
      // consulted, by design.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {
          /* Blocked storage: the stylesheet default (light) applies. */
        }
      })();
    </script>
